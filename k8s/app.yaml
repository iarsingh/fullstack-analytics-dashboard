apiVersion: apps/v1
kind: Deployment
metadata:
  name: fullstack-analytics-dashboard
  labels:
    app: fullstack-analytics-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fullstack-analytics-dashboard
  template:
    metadata:
      labels:
        app: fullstack-analytics-dashboard
    spec:
      containers:
        - name: api
          image: fullstack-analytics-dashboard:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fullstack-analytics-dashboard
spec:
  selector:
    app: fullstack-analytics-dashboard
  ports:
    - port: 80
      targetPort: 8080
