services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PYTHONPATH: /app/src
  postgres:
    image: postgres:16
    profiles: ["full"]
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports: ["5432:5432"]
  redis:
    image: redis:7
    profiles: ["full"]
    ports: ["6379:6379"]
